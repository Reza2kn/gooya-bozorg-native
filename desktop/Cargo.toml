[package]
name = "gooya-native-desktop"
version = "1.5.0"
edition = "2024"
license = "CC-BY-NC-4.0"
publish = false

[features]
default = ["gui"]
gui = ["dep:eframe", "dep:arabic_reshaper"]

[[bin]]
name = "gooya-native-desktop"
path = "src/main.rs"
required-features = ["gui"]

[dependencies]
anyhow = "1.0"
arabic_reshaper = { version = "0.4.2", optional = true }
eframe = { version = "0.31.1", default-features = false, features = ["accesskit", "wgpu", "wayland", "x11"], optional = true }
ndarray = "0.17"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tokenizers = { version = "0.21", default-features = false, features = ["onig"] }
tract-onnx = "=0.23.4"
tract-core = "=0.23.4"
tract-linalg = { version = "=0.23.4", features = ["multithread-mm"] }
env_logger = "0.11"

[target.'cfg(target_os = "macos")'.dependencies]
ort = { version = "2.0.0-rc.13", features = ["lax-feature-matching", "coreml"] }

[target.'cfg(target_os = "linux")'.dependencies]
ort = { version = "2.0.0-rc.13", features = ["lax-feature-matching", "cuda"] }

[target.'cfg(target_os = "windows")'.dependencies]
ort = { version = "2.0.0-rc.13", features = ["lax-feature-matching", "directml"] }

[target.'cfg(not(any(target_os = "macos", target_os = "linux", target_os = "windows")))'.dependencies]
ort = "2.0.0-rc.13"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

[dev-dependencies]
env_logger = "0.11"
